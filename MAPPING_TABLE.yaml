# ── B1 定案（2026-08-06，CHECKPOINT_BATCH_1）────────
b1_decisions:
  DateTimeOffset/DateTime 字段（~18 处）: String 原始文本保真（chrono 决策推迟到 B6）
  LaunchResult 委托回调/异常: 省略，由 B3 event.rs CoreEvent 承接
  ModInfo.Active 计算属性: is_active() 方法
  关键字冲突: type -> r#type（JSON 键不变）
  Modrinth ModLoaderType: 逐变体 #[serde(rename)]（neoForge/liteLoader 等）

# ── B2 定案（2026-08-06，CHECKPOINT_BATCH_2）────────
b2_decisions:
  MurmurHash2: from_le_bytes + wrapping + h as i64（uint 零扩展）；尾部 goto 穿透为累积异或
  class 常量池: 17 种 CONSTANT_* 1:1 移植（version_json.rs）
  NBT: 仅支持 Byte/String/List(Compound)/Compound，其余抛错（同源）
  OS 版本匹配: 无 std 等价 → 恒不匹配（可选 os_info crate）
  MinecraftDateTime: 轻量结构（year i32 + 时分秒 u8 + offset_minutes），无 chrono
  launcher_profiles.json: 源 AOT 无实现 → 暂缓（B11 评估）

# ── 事件映射（Public/Events/ → src/event.rs）──────
events:
  进度报告事件 -> CoreEvent::Progress { task, current, total }
  日志/输出事件 -> CoreEvent::Log { level, message }
  状态事件 -> CoreEvent::State { phase }
