  Public/Models/LaunchResult.cs + Builder/CoreOptions.cs 内 LaunchOptions/JavaOptions -> models/launch.rs
  Public/Models/JavaResult.cs -> models/java.rs
  Public/Models/ModLoaderResult.cs + MissFileInfo.cs -> models/installer.rs
