# MAPPING_TABLE.yaml — Qomicex.Core.AOT (.NET) → qomicex-core-rust
# 固化所有类型/API/枚举的源→目标映射。写代码前必须查阅此文件；发现新映射先更新此文件再写代码。

meta:
  source_repo: https://github.com/Qomicex-Public/Qomicex.Core.AOT
  source_framework: .NET 10 Native AOT
  target_framework: Rust 2024 edition, rlib
  created: 2026-08-06
  status: 建立中（随移植批次扩充）

# ── 基础设施映射 ───────────────────────────────
runtime:
  System.Text.Json (SourceGen): serde + serde_json derive
  HttpClient: reqwest (tokio)
  Task/async-await: async fn + tokio
  Process: std::process::Command
  IProgress<T>: mpsc::channel<CoreEvent>（见 src/event.rs 设计）
  Tomlyn: toml crate
  System.IO.Compression: zip / bzip2 crates
  SHA1/MD5 内置: sha1 / sha2 / base64 crates
  自定义异常: thiserror Error enum（src/error.rs）

# ── 公开 API 映射（Public/ → api/ traits）────────
# 注：B3 实际签名以源文件为准（README 与源代码存在差异，已在 B3 修正）
api:
  IAuthProvider -> trait AuthProvider (api/auth.rs)
    - AuthenticateAsync -> authenticate(&self, request: AuthRequest) -> Result<AuthResult>
    - ValidateAsync -> validate(&self, access_token) -> Result<bool>
    - InvalidateAsync -> invalidate(&self, access_token) -> Result<()>
    - StartDeviceCodeAsync -> start_device_code()（默认 Ok(None)）
    - PollForTokenAsync -> poll_for_token(device_code)（默认 Ok(None)）
    - CompleteLoginAsync -> complete_login(token, refresh)（默认不支持错误）
    - RefreshLoginAsync -> refresh_login(refresh)（默认不支持错误）
  ILaunchExecutor -> trait LaunchExecutor (api/launch.rs)
    - LaunchAsync -> async launch(options) -> Result<LaunchResult>
    - KillAsync -> async kill(process_id) -> Result<bool>
  IVersionManagementService -> trait VersionManagement (api/version.rs)
    - GetManifestAsync / GetAvailableVersionsAsync / GetLatestVersionsAsync(force_refresh)
    - GetVersionMetadataAsync / IsVersionInstalled / InstallVersionAsync(progress)
    - UninstallVersionAsync / GetInstalledVersions
  IVersionManifestService -> trait VersionManifest (api/version.rs)
    - GetVersionManifestAsync -> get_version_manifest；GetVersionMetadataAsync(url) -> get_version_metadata
  IVersionLocator -> trait VersionLocator (api/version.rs)
    - 重载 GetMissFilesAsync(meta/jsonData) -> get_miss_files / get_miss_files_from_json（4 组同名）
  IResourceCompleter -> trait ResourceCompleter (api/version.rs)
  IDownloadSourceManager -> trait DownloadSourceManager (api/download.rs)
    - GetAvailableSources / GenerateMirrorUrls / TestSourceAsync / AddCustomSource(&mut self) / GetPreferredSource
  IJavaProvider -> trait JavaProvider (api/java.rs)
    - Search -> search(&JavaSearchOptions)；Recommand(java_list, metadata)
    - Check(java, metadata) -> bool；GetPackages(...)
  IInstallerProvider -> trait InstallerProvider (api/installer.rs)
    - GetAvailableModLoaders -> get_available_mod_loaders(game_version, r#type)
  ILocalResourcesFactory -> trait LocalResourcesFactory (api/local.rs)
    - 6 个 Create* -> Box<dyn XxxManager + Send + Sync>（子接口 B10 翻译）
  IServerManager -> trait ServerManager (api/server.rs)（15 方法，CancellationToken 暂用 () 占位）
  IOptionsProvider -> trait OptionsProvider (api/options.rs)（13 方法）
  ICurseForgeSource / IModrinthSource / IFTBSource -> api/expansion.rs（3 traits）

# ── Builder 映射 ────────────────────────────────
