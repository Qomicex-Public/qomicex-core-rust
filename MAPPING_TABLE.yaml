# ── B1 序列化规则（2026-08-06 批次定案）───────────
# C# record/class + 属性 -> Rust struct + derive(Serialize, Deserialize, Debug, Clone, PartialEq)
# JsonPropertyName(camelCase) / CamelCase Policy -> #[serde(rename_all = "camelCase")]
# nullable T? -> Option<T>
# List<T> -> Vec<T>，Dictionary<K,V> -> HashMap<K,V>
# DefaultIgnoreCondition.WhenWritingNull -> #[serde(skip_serializing_if = "Option::is_none")]
# 枚举序列化：
#   UseStringEnumConverter=true 的 context（Modrinth/CurseForge/FTB/Options）-> serde 字符串枚举
#   其余 context（数字默认）-> #[derive(Serialize_repr, Deserialize_repr)] + #[repr(i32)]
# 自定义 converter（JsonConverters/VersionArgumentsConverter.cs）-> 手写 serde 自定义反序列化
#   （new 形态 {"game":[...],"jvm":[...]}；兼容旧形态裸数组——特殊兼容点）

