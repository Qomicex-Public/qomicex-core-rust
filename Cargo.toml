[package]
name = "qomicex-core-rust"
version = "0.1.0"
edition = "2024"
description = "Minecraft launcher core library (Rust version of Qomicex.Core.AOT)"
authors = ["Qomicex Team"]
license = "GPL-3.0"
repository = "https://github.com/Qomicex-Public/qomicex-core-rust"

[lib]
crate-type = ["lib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
serde_repr = "0.1"
sha1 = "0.10"
md-5 = "0.10"
zip = "2"
regex = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "gzip"] }
uuid = { version = "1", features = ["v4"] }
